name: Bot Auto Run SPK

on:
  schedule:
    - cron: '0 * * * *'  # Berjalan setiap 1 jam
  workflow_dispatch:      # Bisa dijalankan manual dari tab Actions

permissions:
  contents: write         # Wajib: Agar GITHUB_TOKEN bisa push file JSON ke repo

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Bot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EMAIL_SCM: ${{ secrets.EMAIL_SCM }}
          PASS_SCM: ${{ secrets.PASS_SCM }}
        run: python bot-scm.py
